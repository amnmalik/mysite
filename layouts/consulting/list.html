{{ define "main" }}
<div class="container pt-5">
    <h2 class="text-center pb-4">Consulting</h2>
    <div class="row justify-content-center">
        {{ range .Pages }}
        <div class="col-lg-4 col-md-6 my-3">
            <a href="{{ .RelPermalink }}" class="text-decoration-none">
            <div class="card h-100 p-4">
                <h5 class="fw-bold mb-2" style="color:#1a1a2e;">{{ .Title }}</h5>
                <p class="secondary-font" style="color:#555;">{{ .Params.description }}</p>
                <div class="mt-auto pt-3" style="font-size:0.8rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--primary-color,#007bff);">Learn more →</div>
            </div>
            </a>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
