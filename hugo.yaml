  # About
  about:
    enable: true
    title: "About Me"
    image: https://avatars.githubusercontent.com/amnmalik
    content: |-
      I am an energy and climate policy researcher with a PhD from the Technical University of Berlin and the Potsdam Institute for Climate Impact Research. My work sits at the intersection of quantitative modelling and policy — using energy system models to inform decisions on India's decarbonisation, carbon markets, and climate-related financial risk.

      I have worked at the [Council on Energy, Environment and Water (CEEW)](https://www.ceew.in/aman-malik) in New Delhi, and previously as a researcher and postdoctoral fellow at the [Potsdam Institute for Climate Impact Research (PIK)](https://www.pik-potsdam.de) in Germany. I am currently available for consulting engagements in energy modelling, climate policy analysis, and transition risk.
    skills:
      enable: true
      title: "Areas of expertise:"
      items:
        - "India energy & climate policy"
        - "Energy system modelling"
        - "Carbon markets & ETS"
        - "Transition risk & climate finance"
        - "Integrated Assessment Models"
        - "Employment implications of energy transition"
        - "Carbon dioxide removal"
        - "R, Python, GAMS, QGIS"
        - "Peer reviewer: Nature, Environmental Research Letters, Climate Policy, Energy Policy, Energy Research and Social Science, Climate Economics"

