  # Hero
  hero:
    enable: true
    intro: "Hi, I'm"
    title: "Aman Malik."
    subtitle: "I'm an independent energy researcher and policy analyst, specialising in energy transition and decarbonisation policy –<br>with particular focus on India."
    content: "I work with governments, research organisations, and financial institutions on energy modelling, climate policy analysis, and climate-related financial risk. I bring a decade of experience in quantitative energy system modelling and direct engagement with policymakers across India and Europe."
