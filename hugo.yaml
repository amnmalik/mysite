  # About
  about:
    enable: true
    title: "About Me"
    content: |-
      PhD from the [Technical University of Berlin](https://www.tu.berlin) and the [Potsdam Institute for Climate Impact Research (PIK)](https://www.pik-potsdam.de). Until recently, Programme Lead at the Low Carbon Economy team at the [Council on Energy, Environment and Water (CEEW)](https://www.ceew.in) in New Delhi; previously researcher and postdoctoral fellow at PIK in Germany. 
      
      [Outside work](/beyond-work), you can see me mapmaking on openstreetmaps – similar to Wikipedia but for maps. I enjoy being outdoors in nature and the mountains - mainly on foot and by bicycle.

     
    skills:
      enable: true
      title: "Areas of expertise:"
      items:
        - "India energy & climate policy"
        - "Energy system modelling"
        - "Carbon markets & ETS"
        - "Transition risk & climate finance"
        - "Integrated Assessment Models"
        - "Employment implications of energy transition"
        - "Carbon dioxide removal"
        - "R, Python, GAMS, QGIS"
   
  # Consulting
  consulting:
    enable: true
    title: "What I Offer"
    intro: "I work with governments, financial institutions, research organisations, and think-tanks on questions at the intersection of energy systems, climate policy, and economics. Engagements typically involve one or more of the following:"
    services:
      - name: "Energy System Modelling"
        icon: "?"
        description: "Working with Integrated Assessment Modes and other energy system tools. Applications include net-zero pathways, power sector planning, and policy impact assessment."
      - name: "Carbon Markets & ETS"
        icon: "??"
        description: "Policy design and analysis of carbon pricing mechanisms like emission trading schemes and carbon credit frameworks - with particular expertise in the Indian context."
      - name: "Transition Risk & Climate Finance"
        icon: "??"
        description: "Country-specific scenario development to inform climate-related financial risk assessment for banks, regulators, and institutional investors."
      - name: "Policy Analysis & Government Engagement"
        icon: "??"
        description: " Working with government departments, ministries, and regulatory bodies to deliver evidence-based policy briefs, research reports on energy transition and decarbonisation"
      - name: "Training & Capacity Building"
        icon: "??"
        description: "Guest lectures, workshops, and executive training on energy economics, climate modelling, and decarbonisation policy for government officials, financial institutions, and academic audiences."
      - name: "Research Review"
        icon: "??"
        description: "Peer review of research papers and technical reports on energy and climate policy, decarbonisation, implications of energy transition on the economy and carbon markets."

  # Experience
  experience:
    enable: true
    items:
      - company: "Council on Energy, Environment and Water (CEEW)"
        logo: "/images/logos/ceew.jpg"
        companyUrl: "https://www.ceew.in/aman-malik"
        jobs:
          - name: "Programme Lead, Low Carbon Economy"
            date: "Jun 2023 - Feb 2026"
            content: |
              Led research on India's energy and climate transition within the Low Carbon Economy team.

              - Modelling-based research on India's Carbon Credit Trading Scheme (CCTS)
              - Co-developing India's first detailed state-level energy model based out of GCAM.
              - Net zero strategies for the states of Gujarat and Uttarakhand
              - Led work on transition risk in the financial sector
              - Part of CEEW's expert team for the Reserve Bank of India's Climate-related Information System (2024-2026)
          - name: "Consultant"
            date: "Oct 2022 - May 2023"
            content: "Consulting engagement with CEEW prior to joining as Programme Lead."

      - company: "Potsdam Institute for Climate Impact Research (PIK)"
        logo: "/images/logos/pik.png"
        companyUrl: "https://www.pik-potsdam.de"
        jobs:
          - name: "Guest Scientist"
            date: "Jul 2022 - Dec 2024"
            content: "Affiliated guest scientist with PIK's Energy Systems group."
          - name: "Postdoctoral Researcher"
            date: "Jan 2022 - Jun 2022"
            content: "Postdoctoral research in the Energy Systems group, Research Department III - Transformation Pathways."
          - name: "Researcher"
            date: "Oct 2017 - Dec 2021"
            content: |
              PhD researcher in the International Climate Policy Team, Energy Systems group, Research Department III - Transformation Pathways.

              - Developed and applied energy system models to assess India's power sector decarbonisation
              - Contributed to multi-model studies on global climate policy and emissions pathways
              - Published research in Nature Communications, Nature Climate Change, Environmental Research Letters, and Energy Policy

